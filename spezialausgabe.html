:root{--bg:#020308}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#7e91a5}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:
 radial-gradient(ellipse 58% 42% at 50% 29%,rgba(12,28,48,.92) 0%,rgba(5,9,19,.74) 52%,rgba(2,3,8,1) 100%)}
#world{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:50% 40%;pointer-events:none;
 /* Bis world.webp da ist, steht hier ein 116-Byte-Vorschaubild --
    die Szene ist nie leer, auch nicht auf schlechter Verbindung. */
 background:url('data:image/webp;base64,UklGRmwAAABXRUJQVlA4IGAAAAAQBACdASogABIAPrFInUmnJCKhMAgA4BYJYwCnFCHWrfpgP5aSgLL/AAD++Q5sneawfG4S4eSXKVW/IAMEayki5krx3uwJQwaa8K6AF6xxyRwizsjn3K2qu4LXn1HYwAA=') 50% 40%/cover no-repeat}
#fxBack{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
#rimM{position:absolute;z-index:2;left:66%;top:4%;width:34%;height:94%;opacity:0;pointer-events:none;
 background:radial-gradient(ellipse 46% 62% at 34% 40%,rgba(120,200,255,.14) 0%,rgba(120,200,255,.04) 48%,transparent 72%);
 filter:blur(14px)}
.logo{position:absolute;left:50%;top:9.5vh;width:min(72vw,980px);height:clamp(170px,32vh,310px);transform:translateX(-50%);z-index:3}
.logo svg{display:block;width:100%;height:100%;overflow:visible;filter:brightness(.9) saturate(1.07) contrast(1.03)}
.underglow{position:absolute;z-index:0;top:52%;height:95%;width:46%;border-radius:50%;filter:blur(42px);pointer-events:none}
#ugWarm{left:2%;opacity:.85;background:radial-gradient(ellipse,rgba(255,150,66,.34) 0%,rgba(228,110,36,.10) 46%,transparent 72%)}
#ugCool{left:52%;opacity:.75;background:radial-gradient(ellipse,rgba(70,180,255,.30) 0%,rgba(40,140,220,.09) 46%,transparent 72%)}
#fxFront{position:absolute;inset:0;z-index:4;width:100%;height:100%;pointer-events:none}
#fxHolo{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none}
#claim{position:absolute;z-index:5;left:50%;top:48vh;transform:translateX(-50%);text-align:center;pointer-events:none}
#claim div{font:300 clamp(17px,1.9vw,27px)/1.75 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;color:#d7e7f4;opacity:0;text-shadow:0 0 18px rgba(120,190,255,.25),0 1px 2px rgba(0,0,0,.85);will-change:opacity,transform}
.caption{display:none;position:fixed;z-index:12;left:28px;bottom:22px;font:500 13px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;color:#60758a;user-select:none}
.panel{display:none;position:fixed;z-index:20;right:16px;bottom:16px;width:238px;background:rgba(4,8,14,.82);border:1px solid rgba(90,130,170,.25);border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px);font-size:12px}
.panel .ttl{font-weight:600;letter-spacing:.08em;font-size:11px;color:#9fc0da;margin-bottom:9px}
.panel .btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel button{flex:1 1 44%;background:#0d1826;border:1px solid rgba(110,160,200,.3);color:#a8c6de;border-radius:6px;padding:5px 4px;font-size:11px;cursor:pointer}
.panel button:hover{background:#14243a}
.panel button.on{background:#1d3a5a;color:#dff0ff;border-color:rgba(150,210,255,.6)}
.panel button#playAll{flex:1 1 100%;background:#132a1c;border-color:rgba(120,220,150,.35);color:#b7e8c6}
.panel label{display:block;margin:7px 0 2px;color:#7e9ab2}
.panel input[type=range]{width:100%;accent-color:#4da3d8}
.panel .ph{margin-top:9px;color:#5c7890;font-size:11px;min-height:14px}
.panel .sec{margin-top:9px;color:#8fb2cc;font-size:10px;letter-spacing:.12em;text-align:center}

.scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 39%,transparent 0 34%,rgba(0,0,0,.19) 72%,rgba(0,0,0,.48) 100%)}

#world{opacity:0}
.logo{opacity:0}

/* ---- Spezialausgabe: Bedienelemente der Werkstatt bleiben fort ---- */
.caption,.panel{display:none !important}

/* ---- Der Erzaehler ----
   Er stand zuerst unten links am Bildrand. Das war ein Fehler: wer las,
   verpasste das Bild, wer sah, verpasste den Satz — zwischen beiden lagen
   fuenfzig Bildschirmprozent. Jetzt steht er direkt unter dem Zeichen, in
   einer Spalte, die mittig sitzt und links ausgerichtet bleibt. Das Auge
   springt eine Zeilenhoehe, nicht eine halbe Seite.

   Die Oberkante rechnet sich aus der Geometrie des Zeichens selbst:
   .logo sitzt bei 9.5vh und ist clamp(170px,32vh,310px) hoch. Unterkante
   plus ein Handbreit — damit haengt der Text an jeder Fenstergroesse
   gleich weit unter dem Zeichen, statt einmal zu raten. */
#off{position:fixed;z-index:14;pointer-events:none;
 left:50%;transform:translateX(-50%);
 top:calc(9.5vh + clamp(170px,32vh,310px) + 26px);
 width:min(50ch,80vw);text-align:left}
#off .zeile{
 font:400 clamp(13.5px,1.36vw,18px)/1.74 'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
 letter-spacing:.015em;color:#c6dbea;text-wrap:pretty;
 text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 22px rgba(0,0,0,.8);
 opacity:0;transform:translateY(7px);
 transition:opacity .55s ease,transform .75s cubic-bezier(.22,.9,.24,1)}
#off .zeile.on{opacity:1;transform:none}
/* Weicher Schatten hinter dem Erzaehler. Ohne ihn verliert er sich, sobald
   das leuchtende Gitter des Bildes darunter liegt. Kein Kasten, ein Hauch:
   die Ellipse laeuft nach allen Seiten auf null aus. */
#off::before{content:"";position:absolute;inset:-26px -54px -24px -46px;z-index:-1;
 pointer-events:none;
 background:radial-gradient(ellipse 62% 118% at 44% 50%,
   rgba(2,4,9,.84) 0%,rgba(2,4,9,.56) 48%,rgba(2,4,9,.18) 78%,rgba(2,4,9,0) 100%);
 filter:blur(10px)}
#off .zeile::before{content:"";display:inline-block;width:14px;height:1px;
 vertical-align:.35em;margin-right:11px;background:rgba(168,188,199,.5)}
#off b{color:#DD7740;font-weight:500}
#off i{color:#A8BCC7;font-style:normal;font-weight:500}
#off u{text-decoration:none;color:#8fa8bb;font-size:.86em;letter-spacing:.06em;
 margin-left:.5em;opacity:.85}

/* Der Schlusstext bekommt eine vierte, andere Zeile: sie uebergibt an die
   Seite, auf der der Besucher gleich steht. */
#claim div.uebergang{
 font:340 clamp(19px,2.2vw,31px)/1.5 'Fraunces',Georgia,serif;letter-spacing:.02em;
 color:#eaf4ff;margin-top:.55em}

@media (max-width:640px){
  #off{top:calc(9.5vh + clamp(170px,32vh,310px) + 18px);width:86vw}
  #off::before{inset:-20px -26px -18px -22px}
}

/* Ueberspringen. Klein, ruhig, immer erreichbar — niemand wird festgehalten. */
#skip{position:fixed;z-index:30;right:max(18px,env(safe-area-inset-right));
 bottom:max(18px,env(safe-area-inset-bottom));
 font:400 13px/1 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em;
 color:#7e97ad;background:rgba(6,12,20,.55);border:1px solid rgba(120,160,195,.22);
 border-radius:8px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px);
 opacity:0;transition:opacity .6s ease,color .25s ease,border-color .25s ease}
#skip.on{opacity:.62}
#skip:hover,#skip:focus-visible{opacity:1;color:#d6e8f6;border-color:rgba(150,200,240,.45);outline:none}

/* Der Vorhang zum Schluss: die Szene sinkt in den Seitengrund der Homepage. */
#vorhang{position:fixed;inset:0;z-index:40;background:#020308;opacity:0;pointer-events:none;
 transition:opacity 1100ms cubic-bezier(.42,0,.32,1)}
#vorhang.zu{opacity:1}
/* Sollte index.html wider Erwarten noch nicht da sein, steht der Besucher
   nicht vor einem toten Schwarz: nach 1,6 s atmet der Trennstrich der Marke
   in der Mitte. Er verschwindet mit dem Wechsel von selbst. */
#warte{position:fixed;left:50%;top:50%;z-index:41;width:5px;height:64px;
 margin:-32px 0 0 -2.5px;border-radius:2.5px;background:#77BEEE;opacity:0;
 pointer-events:none;transition:opacity 620ms ease}
#warte.on{opacity:.42;animation:warteAtem 1900ms ease-in-out infinite}
@keyframes warteAtem{0%,100%{opacity:.16;transform:scaleY(.82)}50%{opacity:.52;transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){#warte.on{animation:none;opacity:.34}}

@media (prefers-reduced-motion: reduce){
  #skip{opacity:.62}
}

<script>

/* ---------- Sprache ----------

}

const contact=$('contactGlow');

const S=2.414;   /* 70 % Tempo — Lesezeit fuer den Erzaehler (war 1.69) */
const sleep=ms=>new Promise(r=>setTimeout(r,ms*S));
const clamp=x=>Math.max(0,Math.min(1,x));
const smooth=t=>t*t*(3-2*t);
const easeOut=t=>1-Math.pow(1-t,4);
const gravity=t=>{const k=11,c=.57;const a=1/(1+Math.exp(k*c));const b=1/(1+Math.exp(-k*(1-c)));return clamp(((1/(1+Math.exp(-k*(t-c))))-a)/(b-a));};
function tween(ms,fn,ease=smooth){return new Promise(res=>{const st=performance.now();function fr(now){const t=clamp((now-st)/(ms*S));fn(ease(t),t);if(t<1)requestAnimationFrame(fr);else res();}requestAnimationFrame(fr);});}
function path(points){return 'M'+points.map((p,i)=>(i?'L':'')+p[0].toFixed(3)+' '+p[1].toFixed(3)).join(' ');}
function mixPoints(a,b,p){return a.map((v,i)=>[v[0]+(b[i][0]-v[0])*p,v[1]+(b[i][1]-v[1])*p]);}

/* ---------- Logo-Pixelkarte (Farbe+Struktur für Photonen-Sampling) ---------- */
let mapData=null, mapRect=null, mapW=0, mapH=0;
const logoXML=new XMLSerializer().serializeToString(svg); /* VOR Klonen serialisiert */
function buildLogoMap(){
  const r = logoSvgEl.getBoundingClientRect();
  const img = new Image();
  img.onload = () => {
    const oc = document.createElement('canvas');
    /* etwas höhere Auflösung für bessere Kanten */
    const scale = Math.min(2, window.devicePixelRatio || 1);
    oc.width  = Math.max(2, Math.ceil(r.width  * scale));
    oc.height = Math.max(2, Math.ceil(r.height * scale));
    const octx = oc.getContext('2d', {willReadFrequently:true});
    octx.drawImage(img, 0, 0, oc.width, oc.height);
    mapData = octx.getImageData(0, 0, oc.width, oc.height).data;
    mapRect = r;
    mapW = oc.width;
    mapH = oc.height;
  };
  const xml = logoXML.replace('<svg ', '<svg width="'+Math.ceil(r.width)+'" height="'+Math.ceil(r.height)+'" ');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}
function sampleLogo(x, y){
  if (!mapData || !mapRect) return null;
  if (x < mapRect.left || x >= mapRect.left + mapRect.width ||
      y < mapRect.top  || y >= mapRect.top  + mapRect.height) return null;
  const scaleX = mapW / mapRect.width;
  const scaleY = mapH / mapRect.height;
  const ix = ((y - mapRect.top) * scaleY | 0) * mapW * 4 +
             ((x - mapRect.left) * scaleX | 0) * 4;
  if (ix < 0 || ix + 3 >= mapData.length) return null;
  const a = mapData[ix + 3];
  if (a < 35) return null;
  return [mapData[ix], mapData[ix+1], mapData[ix+2], a];
}

/* ---------- Glas-Klone ---------- */
let cloneN=0;
function makeClone(fill,stroke,sw,useGlow){
  const px='g'+(++cloneN)+'_';
  const g=glyphs.cloneNode(true);
  g.removeAttribute('id');
  g.querySelectorAll('[id]').forEach(n=>n.setAttribute('id',px+n.getAttribute('id')));
  g.querySelectorAll('[filter]').forEach(n=>n.remove());
  g.querySelectorAll('[style]').forEach(n=>n.removeAttribute('style'));
  g.querySelectorAll('path,rect,ellipse').forEach(n=>{
    const f=n.getAttribute('fill');
    if(f&&f!=='none'){n.setAttribute('fill',fill);
      if(!n.getAttribute('stroke')){n.setAttribute('stroke',stroke);n.setAttribute('stroke-width',sw)}}
    if(n.getAttribute('stroke')&&n.getAttribute('fill')==='none')n.setAttribute('stroke',stroke);
  });
  if(useGlow)g.setAttribute('filter','url(#holoGlow)');
  g.setAttribute('style','mix-blend-mode:screen');
  g.setAttribute('opacity','0');
  svg.appendChild(g);
  return g;
}
function makeGlassClone(paint,filterUrl,blend){
  const px='g'+(++cloneN)+'_';
  const g=glyphs.cloneNode(true);
  g.removeAttribute('id');
  g.querySelectorAll('[id]').forEach(n=>n.setAttribute('id',px+n.getAttribute('id')));
  g.querySelectorAll('[filter]').forEach(n=>n.remove());
  g.querySelectorAll('[style]').forEach(n=>n.removeAttribute('style'));
  g.querySelectorAll('path,rect,ellipse').forEach(n=>{
    const f=n.getAttribute('fill');
    if(f&&f!=='none')n.setAttribute('fill',paint);

const ph={list:[],acc:0,frags:[]};
function photonColor(q){
  /* links kupfern, rechts polarblau, Mitte blass */
  if(q<0.45)return {h:24,s:62,l:62};
  if(q>0.58)return {h:204,s:78,l:70};

function spawnPhotons(n,spreadTop){
  for(let i=0;i<n;i++){
    const x=Math.random()*W;
    const c=photonColor(x/W);
    const z=(spreadTop!==undefined)?(0.55+Math.random()*0.45):Math.random(); /* 0=fern, 1=nah */
    const horizon=H*0.50;
    const yBase=horizon+(H+20-horizon)*(0.12+0.88*z);
    const yStart = spreadTop!==undefined ? spreadTop+Math.random()*(H+30-spreadTop) : yBase+Math.random()*24;
    ph.list.push({x, y:yStart, v:(38+Math.random()*72)*(0.30+0.80*z), z,
      len:(5+Math.random()*9)*(0.40+0.75*z), a:(0.05+Math.random()*0.10)*(0.35+0.75*z),
      h:c.h,s:c.s,l:c.l, charged:false, cr:0,cg:0,cb:0,

function updPhotons(dt,t,rate,allowCharge,kond){
  ph.acc+=rate*gain.dens*dt; const n=Math.floor(ph.acc); ph.acc-=n; if(n>0)spawnPhotons(n);

  xB.globalCompositeOperation='destination-out'; xB.fillStyle='rgba(0,0,0,0.08)'; xB.fillRect(0,0,W,H);

  for(let i=ph.list.length-1;i>=0;i--){
    const p=ph.list[i];
    let vy=-p.v*gain.tempo;
    /* Kondensation über dem Logo */
    if(p.charged&&mapRect&&p.y<mapRect.top&&!p.escape&&kond>0){
      if(p.y>bandTop){vy=-p.v*gain.tempo*0.22;
        p.x+=(cx-p.x)*0.12*dt*kond;
        p.dwell+=dt;
        if(p.dwell>p.dwellMax/Math.max(0.25,kond))p.escape=true;
      }else{p.escape=true;}
    }
    if(p.escape)vy=-(150+p.v*2)*gain.tempo;
    const ny=p.y+vy*dt;
    /* Logo-Kontakt: Farbe + Struktur aufnehmen */
    if(allowCharge&&!p.charged&&gRect&&p.x>=gRect.left&&p.x<=gRect.right&&(p.z===undefined||p.z>0.35)&&mapRect&&ny<=mapRect.top+mapRect.height*0.5){
      const s=sampleLogo(p.x,ny);
      if(s){p.charged=true;
        const mx=Math.max(s[0],s[1],s[2],28), k=255/mx;
        p.cr=Math.min(255,s[0]*k*0.96+22);p.cg=Math.min(255,s[1]*k*0.96+22);p.cb=Math.min(255,s[2]*k*0.96+22);
      }
    }
    /* zeichnen */
    if(p.charged){
      const inGlyph=sampleLogo(p.x,ny);
      const m=Math.min(gain.mit,2);
      const alpha=(inGlyph?0.55:(p.escape?0.34:0.40))*m*Math.max(0,Math.min(1,ny/(H*0.08)));
      const len=inGlyph?p.len*2.0:p.len*1.4;
      const grd=xT.createLinearGradient(p.x,ny,p.x,ny+len);
      grd.addColorStop(0,'rgba('+p.cr+','+p.cg+','+p.cb+','+alpha+')');
      grd.addColorStop(1,'rgba('+p.cr+','+p.cg+','+p.cb+',0)');
      if(inGlyph){xT.strokeStyle='rgba('+p.cr+','+p.cg+','+p.cb+','+(0.08*m)+')';xT.lineWidth=3.2;
        xT.beginPath();xT.moveTo(p.x,ny);xT.lineTo(p.x,ny+len);xT.stroke();}
      xT.strokeStyle=grd;xT.lineWidth=(inGlyph?1.5:1.0);
      xT.beginPath();xT.moveTo(p.x,ny);xT.lineTo(p.x,ny+len);xT.stroke();
      /* Struktur-Staub beim Durchqueren */
      if(inGlyph&&Math.random()<0.16*m){
        ph.frags.push({x:p.x+(Math.random()-0.5)*1.6,y:ny+Math.random()*3,vy:-(16+Math.random()*22),

/* ---------- Uebergabe an die Homepage ----------
   Am Ende der Sequenz sinkt die Szene in den Seitengrund der Homepage
   (#020308 — derselbe Wert dort wie hier). Erst wenn der Vorhang ganz zu
   ist, wird gewechselt; die Homepage spielt dann ihre eigene Eroeffnung:
   das Zeichen kommt nach links oben, das Hologramm steht im Bild.
   index.html ist zu diesem Zeitpunkt laengst vorgeladen. */
const ZIEL='index.html';

/* Der Uebergang war blind: Vorhang zu, location.replace, fertig — und wenn
   index.html in dem Moment langsam kam, sass der Besucher vor Schwarz.
   Jetzt holen wir die Seite gleich beim Start wirklich (das prefetch im Kopf
   ist nur eine Bitte an den Browser, die er ablehnen darf) und wechseln erst,
   wenn sie da ist. Laenger als HOECHSTWARTE warten wir nie — lieber ein
   kurzes Schwarz als ein Steckenbleiben. */
const HOECHSTWARTE=4000;
let seiteDa=false;
const seiteHolen=fetch(ZIEL,{credentials:'same-origin'})
  .then(r=>r.ok?r.text():null)
  .then(t=>{seiteDa=!!t;return t;})
  .catch(()=>null);
const SCHLUSS_MS=8200;
let uebergeben=false;
function uebergabe(){
  if(uebergeben)return;
  uebergeben=true;
  const sk=document.getElementById('skip'); if(sk)sk.classList.remove('on');
  const v=document.getElementById('vorhang');
  v.classList.add('zu');
  /* Der Ton der Szene geht mit — sonst bliebe ein heller Rand stehen. */
  /* Der Vorhang braucht 1150 ms. Ist die Seite bis dahin da, wechseln wir
     sofort danach — das ist der Normalfall. Ist sie es nicht, warten wir
     hinter dem geschlossenen Vorhang weiter, mit dem atmenden Trennstrich,
     und geben nach HOECHSTWARTE trotzdem auf. */
  const t0=performance.now();
  const warte=document.getElementById('warte');
  let zeichen=setTimeout(()=>{ if(!seiteDa&&warte)warte.classList.add('on'); },1600);
  const gehen=()=>{ clearTimeout(zeichen); location.replace(ZIEL); };
  const vorhangZu=new Promise(r=>setTimeout(r,1150));
  const notbremse=new Promise(r=>setTimeout(r,HOECHSTWARTE));
  Promise.all([vorhangZu, Promise.race([seiteHolen, notbremse])]).then(gehen);
}
document.getElementById('skip').addEventListener('click',uebergabe);
addEventListener('keydown',e=>{if(e.key==='Escape')uebergabe();});
/* Der Knopf erscheint erst, wenn die Formation laeuft — vorher stoert er nur. */
setTimeout(()=>{const sk=document.getElementById('skip');if(sk&&!uebergeben)sk.classList.add('on');},2600);

/* ---------- Haupt-Loop ---------- */
let gT=0; /* Glas-Übergang 0..1 */
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; phT+=dt*1000;
  let p=DUR[phase]===Infinity?1:Math.min(1,phT/DUR[phase]);
  if(auto&&phase>=1&&phase<5&&phT>=DUR[phase]){applyPhase(phase+1,true);p=0;}

  let rate=0, allowCharge=false, kond=0, drain=0, rim=0, refl=0, txt=0;
  if(phase===1){rate=85*p;}
  else if(phase===2){rate=150;allowCharge=true;kond=gain.kond;drain=Math.pow(p,1.25);rim=0.35*p;
    gT=Math.max(gT,Math.max(0,(p-0.72)/0.28)*0.55);}
  else if(phase===3){rate=38;allowCharge=false;drain=1;rim=0.15;
    gT=Math.min(1,gT+dt/1.4);}
  else if(phase===4){rate=30;drain=1;rim=0.12;gT=Math.min(1,gT+dt/1.2);
    refl=Math.min(1,phT/900);}
  else if(phase===5){rate=30;drain=1;rim=0.12;gT=1;refl=1;txt=1;
    /* Die drei Zeilen stehen nach 400 + 2*650 + 900 = 2600 ms vollstaendig.
       Danach bekommen sie Standzeit, dann uebergibt die Seite an die Homepage. */
    if(phT>=SCHLUSS_MS)uebergabe();}
  if(phase<2){gT=0;drain=0;}
  if(phase===0){rate=0;}

  lastRefl=refl;
  /* ---- Zones aus: kein flächiges Leuchten mehr ---- */
  for (const z of zones) {
    z.edge.setAttribute('opacity', '0');
    z.core.setAttribute('opacity', '0');
  }
  /* ---- Hologramm: Punktquellen mit asymmetrischer Form + Brechungsknick ---- */
  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }
  function buildCols(){
    prismCols.length = 0;
    if (!gRect || !mapRect) return;
    for (let x = gRect.left + 2; x < gRect.right - 2; x += 2.2) {
      let cov = 0;
      for (let y = mapRect.top; y < mapRect.top + mapRect.height; y += 3) {
        if (sampleLogo(x, y)) cov += 3;
      }
      if (cov >= 18) prismCols.push({x, cov});
    }
  }
  function spawnPrism(randomY){
    if (!prismCols.length) buildCols();
    if (!prismCols.length) return;
    // Spaltenauswahl: Roulette nach Deckung, C-Region (bes. C-Rücken) verstärkt
    let total = 0;
    for (const col of prismCols) {
      const cWeight = (rCr && col.x <= rCr.right + 4) ? 2.4 : 1.0;
      col._w = col.cov * cWeight;
      total += col._w;
    }
    let rnd = Math.random() * total, c = prismCols[prismCols.length - 1];
    for (const col of prismCols) { rnd -= col._w; if (rnd <= 0) { c = col; break; } }
    const knickDir = Math.random() < 0.5 ? -1 : 1;
    const knickAmt = (2.0 + Math.random() * 3.0) * (0.7 + 0.6 * gain.pb);
    const vv = 34 + Math.random() * 30;                        // schneller -> durchläuft die Bahn
    const yStart = randomY
      ? mapRect.top + Math.random() * mapRect.height
      : mapRect.top + mapRect.height + 8;
    // Lebensdauer deckt die volle Bahn (Spawn -> oberer Rand) + kleiner Puffer ab
    const travel = (yStart - (mapRect.top - 10)) / (vv * Math.max(0.3, gain.pt));
    prisms.push({
      x0: c.x + (Math.random() - 0.5) * 2.2,
      x:  c.x + (Math.random() - 0.5) * 2.2,
      y: yStart,
      v: vv,
      r: 5.5 + Math.random() * 4.5,
      ph: Math.random() * 6.28,
      life: 0,
      maxLife: travel * 1.12 + 0.35,
      trail: [],
      enterY: null,
      exitY:  null,
      knickDir,
      knickAmt
    });
  }
  if (refl > 0 && mapRect && gRect) {
    const target = Math.round(14 * gain.pd * refl);
    while (prisms.length < target) spawnPrism(!holoSeeded);
    holoSeeded = true;
    if (Math.random() < dt * 3.5 * refl) {
      for (let tries = 0; tries < 12; tries++) {
        const sx = mapRect.left + Math.random() * mapRect.width;
        const sy = mapRect.top  + Math.random() * mapRect.height;
        if (sampleLogo(sx, sy) && !sampleLogo(sx, sy - 2.5)) {
          sparks.push({x: sx, y: sy, life: 0, max: 0.4 + Math.random() * 0.5});
          break;
        }

    }
  }
  xH.clearRect(0, 0, W, H);
  xH.globalCompositeOperation = 'lighter';
  function palFor(x){
    // C = warm/orange; alles ab C-Ende (Trennlinie, rechter Winkel, F) = polarblau (= Logo)
    if (rCr && x <= rCr.right + 4) return { core:'255,155,70', mid:'255,200,140', halo:'255,120,40' };
    return { core:'120,200,255', mid:'90,175,255', halo:'50,150,255' };
  }
  function glyphSpanAt(x) {
    if (!mapRect) return null;
    let top = null, bot = null;
    const y0 = mapRect.top;
    const y1 = mapRect.top + mapRect.height;
    for (let y = y0; y <= y1; y += 2) {
      if (sampleLogo(x, y)) {
        if (top === null) top = y;
        bot = y;
      }
    }
    if (top === null || bot === null || bot - top < 6) return null;
    return { top, bot };
  }
  for (let i = prisms.length - 1; i >= 0; i--) {
    const p = prisms[i];
    p.life += dt;
    p.y   -= p.v * gain.pt * dt;
    p.x = p.x0;
    if (p.life > p.maxLife || p.y < mapRect.top - 35) {
      prisms.splice(i, 1);
      continue;
    }
    if (refl <= 0) continue;
    const inside = !!(sampleLogo(p.x0, p.y) || sampleLogo(p.x0, p.y + 2) || sampleLogo(p.x0, p.y - 2));
    if (!inside) {
      p.enterY = null;
      p.exitY  = null;
      p.trail.push({x: p.x, y: p.y});
      if (p.trail.length > 8) p.trail.shift();
      continue;
    }
    const span = glyphSpanAt(p.x0);
    if (!span) continue;
    if (p.enterY === null) p.enterY = span.bot;
    p.exitY = span.top;
    const pathLen = Math.max(8, p.enterY - p.exitY);
    let t = (p.enterY - p.y) / pathLen;
    t = Math.max(0, Math.min(1, t));
    const entryZone = 0.13;
    const exitZone  = 0.32;
    let shape;
    if (t < entryZone) {
      const u = t / entryZone;
      shape = u * u * (3 - 2 * u);
      shape = Math.pow(shape, 0.75);
    } else if (t > 1 - exitZone) {
      const u = (1 - t) / exitZone;
      shape = smoothstep(0, 1, u);
      shape = Math.pow(shape, 1.25);
    } else {
      shape = 1;
    }
    let knick = 0;
    if (t < entryZone) {
      const u = t / entryZone;
      knick = Math.sin(u * Math.PI) * p.knickAmt * p.knickDir;
    } else if (t > 1 - exitZone) {
      const u = (t - (1 - exitZone)) / exitZone;
      knick = Math.sin(u * Math.PI) * p.knickAmt * 0.7 * p.knickDir;
    }
    p.x = p.x0 + knick * gain.pb;
    const sizeMul = 0.30 + 0.70 * shape;
    const elong   = 1.0  + 2.1 * shape;
    const radX    = p.r * sizeMul * (0.9 + 0.15 * gain.ps);
    const radY    = radX * elong;
    const born  = Math.min(1, p.life / 0.25);
    const fade  = Math.min(1, Math.max(0, (p.y - (mapRect.top - 6)) / 22));  // erst ganz oben ausglimmen
    const pulse = 0.84 + 0.16 * Math.sin(now * 0.003 + p.ph);
    const a     = gain.pg * refl * born * fade * pulse * (0.55 + 0.45 * shape);
    const pal = palFor(p.x0);
    p.trail.push({x: p.x, y: p.y});
    if (p.trail.length > 8) p.trail.shift();
    xH.save();
    xH.translate(p.x, p.y);
    xH.scale(1, elong);
    const g1 = xH.createRadialGradient(0, 0, 0, 0, 0, radX * 2.0);
    g1.addColorStop(0,   `rgba(${pal.halo},${(0.20 * a).toFixed(3)})`);
    g1.addColorStop(0.5, `rgba(${pal.mid},${(0.09 * a).toFixed(3)})`);
    g1.addColorStop(1,   `rgba(${pal.halo},0)`);
    xH.fillStyle = g1;
    xH.beginPath();
    xH.arc(0, 0, radX * 2.0, 0, Math.PI * 2);
    xH.fill();
    const g2 = xH.createRadialGradient(0, 0, 0, 0, 0, radX);
    g2.addColorStop(0,   `rgba(${pal.core},${(0.52 * a).toFixed(3)})`);
    g2.addColorStop(0.55,`rgba(${pal.mid},${(0.20 * a).toFixed(3)})`);
    g2.addColorStop(1,   `rgba(${pal.core},0)`);
    xH.fillStyle = g2;
    xH.beginPath();
    xH.arc(0, 0, radX, 0, Math.PI * 2);
    xH.fill();
    const g3 = xH.createRadialGradient(0, 0, 0, 0, 0, radX * 0.26);
    g3.addColorStop(0,   `rgba(255,255,255,${(0.78 * a).toFixed(3)})`);
    g3.addColorStop(1,   `rgba(${pal.core},0)`);
    xH.fillStyle = g3;
    xH.beginPath();
    xH.arc(0, 0, radX * 0.26, 0, Math.PI * 2);
    xH.fill();
    xH.restore();
    if (shape > 0.2 && p.trail.length > 2) {
      for (let ti = 0; ti < p.trail.length - 1; ti++) {
        const tr = p.trail[ti];
        const u  = ti / (p.trail.length - 1);
        if (!sampleLogo(tr.x, tr.y) && !sampleLogo(p.x0, tr.y)) continue;
        const ta = a * 0.11 * u * shape;
        const trR = radX * 0.32 * u;
        const gt = xH.createRadialGradient(tr.x, tr.y, 0, tr.x, tr.y, trR);
        gt.addColorStop(0, `rgba(${pal.mid},${ta.toFixed(3)})`);
        gt.addColorStop(1, `rgba(${pal.mid},0)`);
        xH.fillStyle = gt;
        xH.beginPath();
        xH.arc(tr.x, tr.y, trR, 0, Math.PI * 2);
        xH.fill();
      }
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const sp = sparks[i];
    sp.life += dt;
    if (sp.life > sp.max) { sparks.splice(i, 1); continue; }
    const u = Math.sin(Math.PI * sp.life / sp.max);
    xH.fillStyle = `rgba(255,255,255,${(0.55 * u).toFixed(3)})`;
    xH.beginPath();
    xH.arc(sp.x, sp.y, 1.1 + u * 1.6, 0, Math.PI * 2);
    xH.fill();
  }
  /* Claim */
  claimLines.forEach((el,i)=>{
    const o=txt?Math.max(0,Math.min(1,(phT-400-i*650)/900)):0;
    el.style.opacity=o.toFixed(3);
    el.style.transform='translateY('+((1-o)*10).toFixed(2)+'px)';
  });

  /* Logo: Entfärbung + Glas-Crossfade */
  const gray = Math.min(1, drain * 0.85 + gT * 0.15);
  glyphs.style.filter = 'brightness(' + (1 - 0.06 * gray).toFixed(3) +
                        ') saturate(' + (1 - gray).toFixed(3) +
                        ') grayscale(' + gray.toFixed(3) + ')';
  glyphs.setAttribute('opacity', (1 - 0.92 * gT).toFixed(3));
  glassBody.setAttribute('opacity',  (gT * 0.32).toFixed(3));
  glassTopE.setAttribute('opacity',  (gT * 0.78).toFixed(3));
  glassBotE.setAttribute('opacity',  (gT * 0.58).toFixed(3));
  glassGlint.setAttribute('opacity', (gT * 0.22).toFixed(3));
  glassRim2.setAttribute('opacity',  (gT * 0.35).toFixed(3));
  glassRim.setAttribute('opacity',   (gT * 0.62).toFixed(3));
  world.style.opacity = worldT.toFixed(3);
  ugWarm.style.opacity = (worldT * (0.85 - 0.55 * gray)).toFixed(3);
  ugCool.style.opacity = (worldT * (0.75 - 0.45 * gray)).toFixed(3);
  rimM.style.opacity   = rim.toFixed(3);

  updPhotons(dt,now,rate,allowCharge,kond);
  requestAnimationFrame(frame);
}

/* ===== Gesamtsequenz: Intro (Formation) -> Weltwerdung -> Phasen ===== */
async function intro(){
  // Vor-Formation: Buchstaben auseinander, Welt aus, ompute/reedom sichtbar
  worldT=0; world.style.opacity='0';
  ompute.setAttribute('display',''); reedom.setAttribute('display','');
  ompute.setAttribute('opacity','1'); reedom.setAttribute('opacity','1');
  try{svg.pauseAnimations();}catch(e){}
  setVB(FULL); setD(leftBase,l0); setD(leftShine,l0); setD(rightBase,r0); setD(rightShine,r0); setBar(53.5);
  notch.setAttribute('stroke-width','0'); F.setAttribute('transform','translate(0 0)'); C.setAttribute('transform','translate(-262.24 0)');

  await sleep(220);
  off(0);                                   /* der Name steht noch ausgeschrieben */
  await Promise.all([
    logo.animate([{opacity:0,filter:'blur(3.2px)',transform:'translateX(-50%) translateY(8px) scale(.995)'},{opacity:1,filter:'blur(0px)',transform:'translateX(-50%) translateY(0) scale(1)'}],{duration:1120*S,easing:'cubic-bezier(.18,.72,.16,1)',fill:'forwards'}).finished,
    atmosphere.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.88)'},{opacity:.34,transform:'translate(-50%,-50%) scale(1)'}],{duration:1450*S,easing:'ease-out',fill:'forwards'}).finished
  ]);
  off(1);                                   /* gleich gehen ompute und reedom fort */
  await sleep(620);

  await Promise.all([
    ompute.animate([{opacity:1,filter:'blur(0px)',transform:'translateX(0)'},{opacity:.82,offset:.25},{opacity:0,filter:'blur(1.8px)',transform:'translateX(-4px)'}],{duration:680*S,easing:'cubic-bezier(.55,0,.55,1)',fill:'forwards'}).finished,
    reedom.animate([{opacity:1,filter:'blur(0px)',transform:'translateX(0)'},{opacity:.82,offset:.25},{opacity:0,filter:'blur(1.8px)',transform:'translateX(4px)'}],{duration:680*S,easing:'cubic-bezier(.55,0,.55,1)',fill:'forwards'}).finished
  ]);
  off(2);                                   /* der Name ist fort, zwei Zeichen bleiben */
  await sleep(1100);                        /* Atemzug, bevor das C hereinfaehrt.
                                               Die laengste Zeile: zwei Farbnamen
                                               und zwei Zahlen wollen gelesen werden. */
  let contactFxStarted=false;
  let glowAnim=Promise.resolve(), glintAnim=Promise.resolve(), moveF=Promise.resolve();
  const F_LEFT=87.665;
  const FINAL_NOTCH=[[83.95,34.75],[88.75,41.50],[83.95,48.25]];
  const CONTACT_POINT=[[F_LEFT,41.50],[F_LEFT,41.50],[F_LEFT,41.50]];
  function startContactFx(){
    if(contactFxStarted)return;
    contactFxStarted=true;
    // No background streaks or blobs at contact. Flash only the <|> combination itself.
    contact.setAttribute('opacity','0');
    glint.style.opacity='0';
    const comboDuration=340*S;
    glowAnim=Promise.all([
      leftBase.animate([{filter:'brightness(1)'},{filter:'brightness(2.0) drop-shadow(0 0 3px rgba(122,220,255,.95))',offset:.32},{filter:'brightness(1.45)',offset:.62},{filter:'brightness(1)'}],{duration:comboDuration,easing:'ease-out',fill:'none'}).finished,
      leftShine.animate([{filter:'brightness(1)'},{filter:'brightness(2.25) drop-shadow(0 0 4px rgba(210,245,255,.98))',offset:.32},{filter:'brightness(1.5)',offset:.62},{filter:'brightness(1)'}],{duration:comboDuration,easing:'ease-out',fill:'none'}).finished,
      rightBase.animate([{filter:'brightness(1)'},{filter:'brightness(2.0) drop-shadow(0 0 3px rgba(255,196,118,.95))',offset:.32},{filter:'brightness(1.45)',offset:.62},{filter:'brightness(1)'}],{duration:comboDuration,easing:'ease-out',fill:'none'}).finished,
      rightShine.animate([{filter:'brightness(1)'},{filter:'brightness(2.25) drop-shadow(0 0 4px rgba(255,238,210,.98))',offset:.32},{filter:'brightness(1.5)',offset:.62},{filter:'brightness(1)'}],{duration:comboDuration,easing:'ease-out',fill:'none'}).finished,
      barBase.animate([{filter:'brightness(1)'},{filter:'brightness(2.15) drop-shadow(0 0 4px rgba(235,246,255,.98))',offset:.32},{filter:'brightness(1.45)',offset:.62},{filter:'brightness(1)'}],{duration:comboDuration,easing:'ease-out',fill:'none'}).finished,
      barShine.animate([{filter:'brightness(1)'},{filter:'brightness(2.4) drop-shadow(0 0 5px rgba(255,255,255,.98))',offset:.32},{filter:'brightness(1.55)',offset:.62},{filter:'brightness(1)'}],{duration:comboDuration,easing:'ease-out',fill:'none'}).finished
    ]);
    glintAnim=Promise.resolve();
    moveF=(async()=>{await sleep(22);return tween(560,p=>{let x;if(p<0.62){x=1.8*easeOut(p/0.62);}else{const q=(p-0.62)/0.38;x=1.8-(0.5*easeOut(q));}F.setAttribute('transform','translate('+x.toFixed(3)+' 0)')},t=>t)})();
  }

  /* Die Formation ist gedehnt (1080 -> 1450), damit der Erzaehler mitkommt:
     drei Gedanken in 1,8 s waren zu eng, in 3,9 s atmen sie. */
  const FORM=2300;
  setTimeout(()=>off(3), 700*S);            /* der Strich, frueh auf der Fahrt */
  const moveC=tween(FORM,p=>{const x=-262.24+(263.3*p); C.setAttribute('transform','translate('+x.toFixed(3)+' 0)')} ,t=>1-Math.pow(1-t,3));
  const buildInterface=tween(FORM,p=>{
    const lp=mixPoints(l0,l1,p), rp=mixPoints(r0,r1,p);
    setD(leftBase,lp);setD(leftShine,lp);setD(rightBase,rp);setD(rightShine,rp);
    setBar((53.5+22*p).toFixed(3));
    const sw=4-p;
    [leftBase,leftShine,rightBase,rightShine].forEach(e=>e&&e.setAttribute('stroke-width',sw.toFixed(3)));

    // Geometric contact uses the visible round tip, not merely its centreline.
    const tipEdge=rp[1][0]+sw/2;
    const finalTipEdge=r1[1][0]+3/2;
    const indentation=clamp((tipEdge-F_LEFT)/(finalTipEdge-F_LEFT));
    if(indentation>0){
      const q=easeOut(clamp(indentation/0.24));
      setD(notch,mixPoints(CONTACT_POINT,FINAL_NOTCH,q));
      notch.setAttribute('stroke-width',(4.15*q).toFixed(3));
      if(q>=0.48) startContactFx();
    }else{
      setD(notch,CONTACT_POINT);
      notch.setAttribute('stroke-width','0');
    }
  },t=>t*t*(3-2*t));
  await Promise.all([moveC,buildInterface]);
  setD(notch,FINAL_NOTCH); notch.setAttribute('stroke-width','4.15');
  startContactFx();
  off(4);                                   /* der Blitz im ‹|› */
  await tween(180,p=>{C.setAttribute('transform','translate('+(1.06*(1-p)).toFixed(3)+' 0)')},easeOut);
  await sleep(1200);

  off(5);                                   /* das Zeichen steht */

  // Gravity-well push: localized atmosphere bends; glyph geometry remains stable.
  const zoom=tween(1500,p=>setVB(mixVB(FULL,OVER,p)),gravity).then(()=>tween(430,p=>setVB(mixVB(OVER,HERO,p)),easeOut));
  const well=atmosphere.animate([
    {opacity:.34,transform:'translate(-50%,-50%) scale(1)',filter:'blur(0px)'},
    {opacity:.58,transform:'translate(-50%,-50%) scale(.78,1.18)',filter:'blur(.5px)',offset:.60},
    {opacity:.24,transform:'translate(-50%,-50%) scale(.94,1.03)',filter:'blur(0px)'}
  ],{duration:1800*S,easing:'cubic-bezier(.62,0,.14,1)',fill:'forwards'}).finished;

  await sleep(440);
  const cover=occluder.animate([
    {left:'-45vw',opacity:0},
    {left:'20vw',opacity:.82,offset:.26},
    {left:'45vw',opacity:1,offset:.40},
    {left:'55vw',opacity:1,offset:.64},
    {left:'80vw',opacity:.82,offset:.79},
    {left:'145vw',opacity:0}
  ],{duration:1100*S,easing:'linear',fill:'forwards'}).finished;
  const focus=svg.animate([
    {filter:'blur(0px) brightness(1)'},
    {filter:'blur(1.1px) brightness(.98)',offset:.32},
    {filter:'blur(3.1px) brightness(.94)',offset:.49},
    {filter:'blur(1.6px) brightness(.98)',offset:.68},
    {filter:'blur(0px) brightness(1)',offset:1}
  ],{duration:1100*S,easing:'cubic-bezier(.42,0,.18,1)',fill:'forwards'}).finished;

  await Promise.all([glowAnim,glintAnim,moveF,zoom,well,cover,focus]);
  contact.animate([{opacity:.08},{opacity:0}],{duration:650*S,easing:'ease-out',fill:'forwards'});
  // Tiny continuation after the reveal, then rest.
  await logo.animate([
    {transform:'translateX(-50%) translateY(0) scale(1)'},
    {transform:'translateX(-50%) translateY(-1.2px) scale(1.002)',offset:.45},
    {transform:'translateX(-50%) translateY(0) scale(1)'}
  ],{duration:620*S,easing:'cubic-bezier(.18,.72,.18,1)',fill:'forwards'}).finished;
  // — Weltwerdung: Bild blendet ein, Logo bleibt MITTIG (kein Gleiten) —
  // svg-Grade wieder setzen (focus-WAAPI hatte ihn überschrieben)
  svg.animate([{filter:'brightness(.9) saturate(1.07) contrast(1.03)'}],{duration:1,fill:'forwards'});
  atmosphere.animate([{opacity:.24},{opacity:0}],{duration:1500,easing:'ease-out',fill:'forwards'});
  off(6);                                   /* die Welt kommt, das Licht kommt */
  await tween(2200, p=>{ worldT=p; }, t=>t*t*(3-2*t));
  // Buchstaben-Rechtecke NACH der Formation neu messen (C jetzt an finaler Position)
  gRect=glyphs.getBoundingClientRect(); rCr=C.getBoundingClientRect(); rFr=F.getBoundingClientRect();
  prismCols.length=0;
  // — in die Cryo-Solar-Bloom-Phasen —
  applyPhase(1); auto=true;
}
setBtns();
requestAnimationFrame(frame);
intro();
})();
